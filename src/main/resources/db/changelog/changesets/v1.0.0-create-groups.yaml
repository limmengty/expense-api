databaseChangeLog:
  - changeSet:
      id: v1.0.0-create-groups
      author: expense-app
      changes:
        - createTable:
            tableName: groups
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_groups_created_by
            tableName: groups
            columns:
              - column:
                  name: created_by
        - createIndex:
            indexName: idx_groups_created_at
            tableName: groups
            columns:
              - column:
                  name: created_at
            order: DESC
