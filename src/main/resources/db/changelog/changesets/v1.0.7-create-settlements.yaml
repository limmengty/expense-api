databaseChangeLog:
  - changeSet:
      id: v1.0.7-create-settlements
      author: expense-app
      changes:
        - createTable:
            tableName: settlements
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
              - column:
                  name: group_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: from_user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: to_user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: NUMERIC(12, 2)
                  constraints:
                    nullable: false
              - column:
                  name: currency
                  type: CHAR(3)
                  defaultValue: 'USD'
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: settlements
            baseColumnNames: group_id
            referencedTableName: groups
            referencedColumnNames: id
            constraintName: fk_settlements_group
            onDelete: CASCADE
        - sql:
            sql: ALTER TABLE settlements ADD CONSTRAINT chk_settlement_amount_positive CHECK (amount > 0)
        - createIndex:
            indexName: idx_settlements_group_id
            tableName: settlements
            columns:
              - column:
                  name: group_id
        - createIndex:
            indexName: idx_settlements_from_user
            tableName: settlements
            columns:
              - column:
                  name: from_user_id
        - createIndex:
            indexName: idx_settlements_to_user
            tableName: settlements
            columns:
              - column:
                  name: to_user_id
