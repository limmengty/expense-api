databaseChangeLog:
  - changeSet:
      id: v1.0.1-create-group-members
      author: expense-app
      changes:
        - createTable:
            tableName: group_members
            columns:
              - column:
                  name: group_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: joined_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
            constraints:
              primaryKey: true
              primaryKeyName: pk_group_members
        - addForeignKeyConstraint:
            baseTableName: group_members
            baseColumnNames: group_id
            referencedTableName: groups
            referencedColumnNames: id
            constraintName: fk_group_members_group
            onDelete: CASCADE
        - createIndex:
            indexName: idx_group_members_user_id
            tableName: group_members
            columns:
              - column:
                  name: user_id
