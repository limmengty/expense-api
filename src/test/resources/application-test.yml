spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/expense_test
    username: test
    password: test
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    enabled: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/test

logging:
  level:
    com.mt.expense.app: DEBUG
    org.hibernate.SQL: DEBUG