name: expense-api CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: mengty199/expense-api

permissions:
  contents: write

jobs:
  # ── Test ───────────────────────────────────────────────────
  test:
    name: Test (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run unit tests
        run: chmod +x mvnw && ./mvnw test -B -DexcludedGroups=integration

  # ── Build & Push ───────────────────────────────────────────
  build-push:
    name: Build & Push Image
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=branch

      - name: Scan Dockerfile for misconfigs
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        env:
          TRIVY_SEVERITY: CRITICAL,HIGH
          TRIVY_SCANNERS: vuln
          TRIVY_VULN_TYPE: library
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          exit-code: '1'

  # ── Update CD Repo ─────────────────────────────────────────
  update-cd:
    name: Update CD Manifest
    needs: build-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout CD repo
        uses: actions/checkout@v4
        with:
          repository: limmengty/k8s-expense-demo
          token: ${{ secrets.GITHUB_TOKEN }}
          path: cd-repo

      - name: Install kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Determine target overlay
        id: env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "overlay=staging" >> $GITHUB_OUTPUT
          else
            echo "overlay=dev" >> $GITHUB_OUTPUT
          fi

      - name: Patch image tag in overlay
        run: |
          kustomize edit set image mengty199/expense-api=mengty199/expense-api:${{ needs.build-push.outputs.image-tag }}
        working-directory: cd-repo/apps/expense-api/overlays/${{ steps.env.outputs.overlay }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/expense-api/overlays/${{ steps.env.outputs.overlay }}/kustomization.yaml
          git commit -m "ci(expense-api): update image → ${{ needs.build-push.outputs.image-tag }} [${{ steps.env.outputs.overlay }}]"
          git push
        working-directory: cd-repo
